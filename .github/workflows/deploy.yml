name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build and Deploy
        uses: appleboy/ssh-action@master
        env:
          APP_KEYS: ${{ secrets.APP_KEYS }}
          API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: APP_KEYS,API_TOKEN_SALT,ADMIN_JWT_SECRET,TRANSFER_TOKEN_SALT,JWT_SECRET,DATABASE_HOST,DATABASE_PORT,DATABASE_NAME,DATABASE_USERNAME,DATABASE_PASSWORD
          script: |
            # set node env
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            nvm use 20
            
            # checkout
            cd ~/registry
            git reset --hard origin/main
            git pull origin main
            
            # build noders-registry plugin
            cd ~/registry/src/plugins/noders-registry
            yarn install
            NODE_ENV=production yarn build || exit 1
            
            # build strapi
            cd ~/registry
            yarn install
            NODE_ENV=production yarn build || exit 1
            
            # generate ecosystem.config.json
            cat <<EOT > ~/registry/ecosystem.config.json
            {
              "apps": [
                {
                  "name": "noders-registry-strapi-app",
                  "cwd": "/home/registry/registry",
                  "script": "yarn",
                  "args": "start",
                  "autorestart": true,
                  "restart_delay": 1000,
                  "env": {
                    "HOST": "0.0.0.0",
                    "PORT": "1337",
                    "NODE_ENV": "production",
                    "APP_KEYS": "$APP_KEYS",
                    "API_TOKEN_SALT": "$API_TOKEN_SALT",
                    "ADMIN_JWT_SECRET": "$ADMIN_JWT_SECRET",
                    "TRANSFER_TOKEN_SALT": "$TRANSFER_TOKEN_SALT",
                    "JWT_SECRET": "$JWT_SECRET",
                    "DATABASE_CLIENT": "postgres",
                    "DATABASE_HOST": "$DATABASE_HOST",
                    "DATABASE_PORT": "$DATABASE_PORT",
                    "DATABASE_NAME": "$DATABASE_NAME",
                    "DATABASE_USERNAME": "$DATABASE_USERNAME",
                    "DATABASE_PASSWORD": "$DATABASE_PASSWORD",
                    "DATABASE_SSL": "false"
                  }
                }
              ]
            }
            EOT
            
            # restart pm2
            pm2 restart ~/registry/ecosystem.config.json
